<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>复制 Eagle 路径</title>
<style>
  :root {
    --fg: #e6e8ec; --fg-dim: #9aa3ae; --fg-mute: #6b7480;
    --panel: rgba(255,255,255,.045); --line: rgba(255,255,255,.11);
    --btn: #3b414a; --btn-hi: #474e58;
    --accent: #3a6ea5; --accent-hi: #4a82bd;
    --ok: #6fd3a7; --err: #e07a6a;
    --sheet: #22262d; --field: rgba(0,0,0,.28);
  }
  body[theme="LIGHT"], body[theme="LIGHTGRAY"] {
    --fg: #1f2329; --fg-dim: #5b6470; --fg-mute: #8a929c;
    --panel: rgba(0,0,0,.035); --line: rgba(0,0,0,.12);
    --btn: #e3e7ec; --btn-hi: #d4d9df;
    --accent: #2f6fb0; --accent-hi: #3a80c6;
    --ok: #1f8f5f; --err: #c0503f;
    --sheet: #f6f7f9; --field: rgba(255,255,255,.9);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    position: relative; background: transparent; color: var(--fg);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 12px; line-height: 1.4; padding: 7px 9px;
    display: flex; flex-direction: column; gap: 5px; user-select: none;
  }

  #head { display: flex; align-items: center; gap: 6px; min-height: 16px; }
  #title { flex: 1 1 auto; color: var(--fg-dim); font-size: 11px; letter-spacing: .3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #gear {
    flex: 0 0 auto; background: none; border: none; color: var(--fg-dim);
    cursor: pointer; font-size: 13px; line-height: 1; padding: 0 2px;
  }
  #gear:hover { color: var(--fg); }

  #rows {
    display: flex; flex-direction: column; gap: 1px;
    padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel);
  }
  .r { display: flex; align-items: center; gap: 6px; height: 17px; }
  .r.hide { display: none; }
  .r .k { flex: 0 0 auto; color: var(--fg-mute); font-size: 10.5px; }
  .r .v {
    flex: 1 1 auto; min-width: 0; color: var(--fg); font-size: 11.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    user-select: text; cursor: text;
  }
  .r .v.empty { color: var(--fg-mute); }
  #folderPick {
    display: none; flex: 0 0 80px; min-width: 0; padding: 2px 3px; font: inherit; font-size: 10.5px;
    border: 1px solid var(--line); border-radius: 5px; background: var(--field); color: var(--fg);
  }
  #folderPick.show { display: block; }

  #btns { display: flex; gap: 5px; }
  #btns button {
    flex: 1 1 0; min-width: 0; padding: 7px 2px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--btn); color: var(--fg); font-size: 12px; font-weight: 500; letter-spacing: .2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: pointer; transition: background .12s, color .12s;
  }
  #btns button:hover { background: var(--btn-hi); }
  #btns button.hide { display: none; }
  #btns button.solo { flex: 1 1 100%; }
  #btns button.primary { background: var(--accent); border-color: transparent; color: #fff; }
  #btns button.primary:hover { background: var(--accent-hi); }
  #btns button.ok { background: var(--ok); border-color: transparent; color: #10281e; }
  #btns button:disabled { background: var(--btn); border-color: var(--line); color: var(--fg-mute); cursor: not-allowed; }

  #status {
    font-size: 10.5px; color: var(--fg-dim); min-height: 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }

  #settings {
    position: absolute; inset: 0; z-index: 5; display: none; flex-direction: column;
    gap: 5px; padding: 8px 10px; background: var(--sheet); border-radius: 6px;
  }
  #settings.show { display: flex; }
  #settings .srow { display: flex; align-items: center; gap: 6px; color: var(--fg-dim); font-size: 11.5px; }
  #settings .srow > span:first-child { flex: 0 0 48px; }
  #settings select {
    flex: 1 1 auto; min-width: 0; padding: 3px 5px; font: inherit; font-size: 11.5px;
    border: 1px solid var(--line); border-radius: 5px; background: var(--field); color: var(--fg);
  }
  #settings label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--fg-dim); font-size: 11.5px; }
  #settings label:hover { color: var(--fg); }
  #settings input[type="checkbox"] { accent-color: var(--accent); }
  #settings .hint { flex: 1 1 auto; min-width: 0; font-size: 10px; line-height: 1.45; color: var(--fg-mute); white-space: pre-line; overflow: hidden; }
  #close {
    flex: 0 0 auto; padding: 3px 10px; border: none; border-radius: 5px;
    background: var(--btn); color: var(--fg); font: inherit; font-size: 11.5px; cursor: pointer;
  }
  #close:hover { background: var(--btn-hi); }
</style>
</head>
<body>
  <div id="head">
    <span id="title">Eagle 路径</span>
    <select id="folderPick" title="该素材归属多个文件夹，选择要复制的那一条"></select>
    <button id="gear" title="格式设置">⚙</button>
  </div>

  <div id="rows">
    <div class="r" id="rFile">
      <span class="k">文件</span>
      <span class="v empty" id="rowFile">读取中…</span>
    </div>
    <div class="r" id="rFolder">
      <span class="k">文件夹</span>
      <span class="v empty" id="rowFolder">读取中…</span>
    </div>
  </div>

  <div id="btns">
    <button id="copyFile" disabled>复制文件路径</button>
    <button id="copyFolder" disabled>复制文件夹路径</button>
  </div>

  <div id="status">选中素材后可用</div>

  <div id="settings">
    <div class="srow">
      <span>分隔符</span>
      <select id="sep">
        <option value=" \ ">空格 \ 空格（默认）</option>
        <option value="\">\</option>
        <option value="/">/</option>
        <option value=" &gt; "> &gt; </option>
        <option value=" → "> → </option>
      </select>
    </div>
    <label><input type="checkbox" id="withExt"> 文件名带扩展名（.mp4 / .png）</label>
    <div class="srow">
      <span class="hint" id="sample"></span>
      <button id="close">完成</button>
    </div>
  </div>

  <script src="js/core.js?v=1.3.0"></script>
  <script src="js/plugin.js?v=1.3.0"></script>
</body>
</html>
