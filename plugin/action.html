<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>复制 Eagle 路径</title>
<style>
  :root {
    --fg: #e6e8ec; --fg-dim: #9aa3ae; --fg-mute: #6b7480;
    --panel: #22262d; --line: rgba(255,255,255,.14); --field: rgba(0,0,0,.28);
    --btn: #3b414a; --btn-hi: #474e58;
    --accent: #3a6ea5; --accent-hi: #4a82bd;
    --ok: #6fd3a7; --err: #e07a6a;
  }
  body[theme="LIGHT"], body[theme="LIGHTGRAY"] {
    --fg: #1f2329; --fg-dim: #5b6470; --fg-mute: #8a929c;
    --panel: #f6f7f9; --line: rgba(0,0,0,.14); --field: rgba(255,255,255,.9);
    --btn: #e3e7ec; --btn-hi: #d4d9df;
    --accent: #2f6fb0; --accent-hi: #3a80c6;
    --ok: #1f8f5f; --err: #c0503f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 12px; line-height: 1.45;
    display: flex; flex-direction: column; gap: 8px; user-select: none;
  }
  #head { display: flex; align-items: center; gap: 8px; }
  #ttl { flex: 1 1 auto; color: var(--fg-dim); font-size: 11px; letter-spacing: .3px; }
  #badge { flex: 0 0 auto; font-size: 11px; color: var(--fg-mute); }
  #badge.ok { color: var(--ok); }
  #badge.err { color: var(--err); }

  #rows {
    display: flex; flex-direction: column; gap: 2px;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--field);
  }
  .r { display: flex; align-items: baseline; gap: 8px; min-height: 17px; }
  .r.hide { display: none; }
  .r .k { flex: 0 0 auto; color: var(--fg-mute); font-size: 10.5px; }
  .r .v {
    flex: 1 1 auto; min-width: 0; font-size: 12.5px; color: var(--fg);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    user-select: text; cursor: text;
  }
  .r .v.empty { color: var(--fg-mute); }

  #btns { display: flex; gap: 8px; }
  button {
    flex: 1 1 0; min-width: 0; padding: 8px 0; border: none; border-radius: 6px;
    background: var(--btn); color: var(--fg); font: inherit; font-size: 12.5px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  button:hover { background: var(--btn-hi); }
  button.hide { display: none; }
  button.solo { flex: 1 1 100%; }
  #copyFile.primary, #copyFolder.primary { background: var(--accent); color: #fff; }
  #copyFile.primary:hover, #copyFolder.primary:hover { background: var(--accent-hi); }
  #btns button.ok { background: var(--ok); color: #10281e; }
  button:disabled { color: var(--fg-mute); cursor: not-allowed; }

  #foot { display: flex; align-items: center; gap: 8px; }
  #hint { flex: 1 1 auto; font-size: 10.5px; color: var(--fg-mute);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #close { flex: 0 0 auto; padding: 4px 12px; font-size: 11.5px; background: var(--btn); }
</style>
</head>
<body>
  <div id="head">
    <span id="ttl">Eagle 路径</span>
    <span id="badge">读取中…</span>
  </div>

  <div id="rows">
    <div class="r" id="rFile">
      <span class="k">文件</span>
      <span class="v empty" id="rowFile">—</span>
    </div>
    <div class="r" id="rFolder">
      <span class="k">文件夹</span>
      <span class="v empty" id="rowFolder">—</span>
    </div>
  </div>

  <div id="btns">
    <button id="copyFile" disabled>复制文件路径</button>
    <button id="copyFolder" disabled>复制文件夹路径</button>
  </div>

  <div id="foot">
    <span id="hint">点按钮复制 · Esc 关闭</span>
    <button id="close">关闭</button>
  </div>

  <script src="js/core.js?v=1.3.0"></script>
  <script src="js/action.js?v=1.3.0"></script>
</body>
</html>
